
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME ART 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050b13;color:white;
 font-family:Tahoma,Arial;text-align:center;
 overflow:hidden
}
header{padding:12px;color:#8deaff}
h1{margin:5px;font-size:27px}
button{
 border:1px solid #54dfff;
 background:#10283b;color:white;
 border-radius:12px;padding:12px 18px;
 margin:5px;font-size:15px;cursor:pointer
}
button:active{background:#087ba0}
#menu{padding:15px}
.gameCard{
 display:inline-block;background:#0c1c2b;
 border:1px solid #23617d;border-radius:15px;
 padding:15px;margin:8px;width:145px
}
.gameCard span{font-size:40px;display:block}
#game{display:none}
#screen{width:100%;height:65vh;display:block}
#hud{
 position:absolute;top:10px;left:10px;
 right:10px;display:flex;justify-content:space-between;
 pointer-events:none
}
.info{
 background:#061522dd;border:1px solid #3bdcff;
 border-radius:10px;padding:9px
}
#controls{
 position:absolute;bottom:12px;left:0;right:0;
 display:flex;justify-content:space-around;
 align-items:center
}
.control{width:65px;height:58px;font-size:23px}
#message{
 position:absolute;top:40%;left:0;right:0;
 font-size:22px;color:#a8f4ff;
 pointer-events:none
}
</style>
</head>
<body>

<header>
<h1>GAME ART 3D</h1>
<div>دنیای بازی‌های سه‌بعدی</div>
</header>

<div id="menu">
<h2>انتخاب بازی</h2>

<div class="gameCard">
<span>🚗</span>
<b>ART RACING</b>
<p>مسابقه ماشین</p>
<button onclick="startGame('car')">بازی کن</button>
</div>

<div class="gameCard">
<span>🍔</span>
<b>FOOD WORLD</b>
<p>جمع‌آوری غذا</p>
<button onclick="startGame('food')">بازی کن</button>
</div>

<div class="gameCard">
<span>🍕</span>
<b>FOOD PIZZA</b>
<p>به‌زودی</p>
</div>

<div class="gameCard">
<span>🍉</span>
<b>FRUIT GAME</b>
<p>به‌زودی</p>
</div>

</div>

<div id="game">
<div id="hud">
<div class="info" id="gameName">بازی</div>
<div class="info">امتیاز: <span id="score">0</span></div>
<div class="info">رکورد: <span id="record">0</span></div>
</div>

<div id="message">آماده‌ای؟</div>
<div id="controls">
<button class="control" id="left">⬅️</button>
<button class="control" id="brake">⏸</button>
<button class="control" id="gas">⬆️</button>
<button class="control" id="right">➡️</button>
</div>
<button onclick="backMenu()">بازگشت به منو</button>
</div>

<script>
let scene,camera,renderer;
let mode="car";
let player,objects=[];
let score=0;
let speed=0.12;
let lane=0;
let moveLeft=false,moveRight=false;
let running=false;
let lastSpawn=0;
let world;
let playerParts=[];

const menu=document.getElementById("menu");
const game=document.getElementById("game");
const scoreText=document.getElementById("score");
const message=document.getElementById("message");

function startGame(type){
 mode=type;
 menu.style.display="none";
 game.style.display="block";
 document.getElementById("gameName").innerText=
 type==="car"?"ART RACING":"FOOD WORLD";
 message.innerText="شروع بازی!";
 score=0;
 lane=0;
 speed=0.12;
 objects=[];
 scoreText.innerText="0";
 if(renderer){
  renderer.dispose();
  renderer.domElement.remove();
 }
 scene=new THREE.Scene();
 scene.background=new THREE.Color(
  type==="car"?0x83c9e8:0x142c39
 );
 scene.fog=new THREE.Fog(scene.background,20,75);

 camera=new THREE.PerspectiveCamera(
  65,window.innerWidth/(window.innerHeight*.65),.1,1000
 );
 camera.position.set(0,6,10);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(window.innerWidth,window.innerHeight*.65);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.domElement.id="screen";
 game.insertBefore(renderer.domElement,
 document.getElementById("hud"));

 const light=new THREE.HemisphereLight(0xffffff,0x334455,2);
 scene.add(light);
 const sun=new THREE.DirectionalLight(0xffffff,1.5);
 sun.position.set(5,10,5);
 scene.add(sun);

 if(type==="car")buildCarWorld();
 else buildFoodWorld();

 running=true;
 lastSpawn=0;
 animate();
}

function box(w,h,d,color,x,y,z){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color:color})
 );
 mesh.position.set(x,y,z);
 scene.add(mesh);
 return mesh;
}

function buildCarWorld(){
 // جاده
 box(10,.2,100,0x252b35,0,-.2,-35);

 // خط‌کشی جاده
 for(let z=5;z>-90;z-=7){
  box(.12,.03,3,0xffffff,0,-.08,z);
  box(.12,.03,3,0xffffff,-3,-.08,z);
  box(.12,.03,3,0xffffff,3,-.08,z);
 }

 // محیط کنار جاده
 for(let i=0;i<35;i++){
  let z=5-i*3;
  box(2,2+Math.random()*4,2,
  0x17465a,-8,1,z);
  box(2,2+Math.random()*4,2,
  0x17465a,8,1,z);
 }

 createCar();
 camera.position.set(0,6,10);
 camera.lookAt(0,1,-5);
}

function createCar(){
 player=new THREE.Group();
 scene.add(player);
 player.position.set(0,0,3);

 // بدنه اصلی پراید هاچ‌بک ساده‌شده
 const body=box(1.7,.55,3,0x168bdb,0,.65,0);
 player.remove(body);
 player.add(body);
 body.position.set(0,.65,0);

 const roof=box(1.35,.65,1.5,0x0875b5,0,1.2,-.1);
 player.add(roof);

 const window1=box(1.25,.38,.05,0x9cecff,0,1.35,-.86);
 player.add(window1);

 const window2=box(1.25,.38,.05,0x9cecff,0,1.35,.66);
 player.add(window2);

 const hood=box(1.6,.15,.7,0x168bdb,0,.95,1.05);
 player.add(hood);

 const bumper=box(1.7,.18,.18,0xeeeeee,0,.4,1.55);
 player.add(bumper);

 // چراغ‌ها
 const lamp1=box(.35,.16,.08,0xffffbb,-.55,.83,1.57);
 const lamp2=box(.35,.16,.08,0xffffbb,.55,.83,1.57);
 player.add(lamp1,lamp2);

 // چرخ‌ها
 for(let x of [-.95,.95]){
  for(let z of [-.95,.95]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.36,.36,.2,20),
    new THREE.MeshStandardMaterial({color:0x111111})
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.4,z);
   player.add(wheel);
  }
 }

 camera.lookAt(0,1,0);
}

function buildFoodWorld(){
 // زمین آشپزخانه
 box(35,.3,70,0x294d3c,0,-.3,-25);

 // دیوارهای رنگی محیط
 box(35,8,1,0x345b72,0,4,-55);
 box(1,8,70,0x24465c,-17,4,-25);
 box(1,8,70,0x24465c,17,4,-25);

 // سبد بازیکن
 player=new THREE.Group();
 scene.add(player);
 player.position.set(0,0,4);

 const basket=box(2,.5,1.2,0x168bdb,0,.5,0);
 player.add(basket);
 const edge1=box(.15,.7,1.3,0x75dfff,-1, .8,0);
 const edge2=box(.15,.7,1.3,0x75dfff,1,.8,0);
 const edge3=box(2,.7,.15,0x75dfff,0,.8,-.55);
 player.add(edge1,edge2,edge3);

 camera.position.set(0,9,13);
 camera.lookAt(0,0,-4);
}

const foods=[
 {emoji:"🍎",color:0xe83b3b},
 {emoji:"🍌",color:0xf5d323},
 {emoji:"🍊",color:0xff8a22},
 {emoji:"🥕",color:0xff7222},
 {emoji:"🍇",color:0x9b51c8},
 {emoji:"🍉",color:0x29a84a},
 {emoji:"🥦",color:0x228b42}
];

function spawnFood(){
 let item=foods[Math.floor(Math.random()*foods.length)];
 const obj=new THREE.Group();
 const fruit=new THREE.Mesh(
  new THREE.SphereGeometry(.45,16,16),
  new THREE.MeshStandardMaterial({color:item.color})
 );
 obj.add(fruit);
 obj.position.set((Math.random()-.5)*12,6,-25);
 obj.userData.food=true;
 scene.add(obj);
 objects.push(obj);
}

function spawnObstacle(){
 const obstacle=new THREE.Group();
 const color=[0xe94c35,0xf3b52c,0xeeeeee]
 [Math.floor(Math.random()*3)];

 const shape=box(1.5,1.1,1.4,color,0,.55,0);
 obstacle.add(shape);
 obstacle.position.set(
  [-3,0,3][Math.floor(Math.random()*3)],
  0,-45
 );
 scene.add(obstacle);
 objects.push(obstacle);
}

function animate(){
 if(!running)return;
 requestAnimationFrame(animate);

 if(moveLeft)lane-=.08;
 if(moveRight)lane+=.08;
 lane=Math.max(-4,Math.min(4,lane));

 player.position.x+=(lane-player.position.x)*.15;

 if(mode==="car"){
  camera.position.x=player.position.x*.25;
  camera.lookAt(player.position.x*.25,1,-5);
  if(Math.random()<.018)spawnObstacle();
 }else{
  camera.lookAt(player.position.x*.2,0,-5);
  if(Math.random()<.025)spawnFood();
 }

 for(let i=objects.length-1;i>=0;i--){
  const obj=objects[i];
  obj.position.z+=mode==="car"?speed:speed*1.3;

  if(mode==="food"){
   obj.position.y-=.025;
  }

  const dx=Math.abs(obj.position.x-player.position.x);
  const dz=Math.abs(obj.position.z-player.position.z);

  if(dx<1.5 && dz<1.7){
   if(mode==="food" && obj.userData.food){
    score+=10;
    scoreText.innerText=score;
    scene.remove(obj);
    objects.splice(i,1);
    continue;
   }
   if(mode==="car"){
    gameOver();
    return;
   }
  }

  if(obj.position.z>12 || obj.position.y<-.5){
   scene.remove(obj);
   objects.splice(i,1);
  }
 }

 if(mode==="car"){
  score+=1;
  scoreText.innerText=Math.floor(score/10);
 }

 renderer.render(scene,camera);
}

function gameOver(){
 running=false;
 message.innerText="برخورد کردی! امتیاز: "+Math.floor(score/10);
 const old=Number(localStorage.getItem("carRecord")||0);
 if(score/10>old){
  localStorage.setItem("carRecord",Math.floor(score/10));
 }
 document.getElementById("record").innerText=
 localStorage.getItem("carRecord")||0;
}

function backMenu(){
 running=false;
 game.style.display="none";
 menu.style.display="block";
 if(renderer){
  renderer.dispose();
  renderer.domElement.remove();
 }
}

function bindButton(id,direction){
 const btn=document.getElementById(id);
 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(direction==="left")moveLeft=true;
  if(direction==="right")moveRight=true;
  if(direction==="gas")speed=.2;
  if(direction==="brake")speed=.06;
 });
 const stop=()=>{
  if(direction==="left")moveLeft=false;
  if(direction==="right")moveRight=false;
  if(direction==="gas")speed=.12;
  if(direction==="brake")speed=.12;
 };
 btn.addEventListener("pointerup",stop);
 btn.addEventListener("pointerleave",stop);
 btn.addEventListener("pointercancel",stop);
}

bindButton("left","left");
bindButton("right","right");
bindButton("gas","gas");
bindButton("brake","brake");

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")moveLeft=true;
 if(e.key==="ArrowRight"||e.key==="d")moveRight=true;
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")moveLeft=false;
 if(e.key==="ArrowRight"||e.key==="d")moveRight=false;
});

window.addEventListener("resize",()=>{
 if(!renderer)return;
 camera.aspect=window.innerWidth/(window.innerHeight*.65);
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight*.65);
});
</script>
</body>
</html>
